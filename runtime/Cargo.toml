[package]
name = "mah-vm"
version = "0.2.0"
edition = "2024"
description = "Native (Rust) runtime for Mah .mahc bytecode -- see docs/RUST_VM.md"
publish = false

# A small, vetted set of dependencies (docs/STDLIB.md "Decisions"), each
# with its reason:
[dependencies]
# std:regex's matcher (M32). No default features: Unicode tables only, no
# SIMD/aho-corasick prefilters, to keep the binary small.
regex = { version = "1.13", default-features = false, features = ["std", "unicode"] }

[lib]
name = "mah_vm"
path = "src/lib.rs"

[[bin]]
name = "mah-vm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
