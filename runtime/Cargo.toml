[package]
name = "mah-vm"
version = "0.3.0"
edition = "2024"
description = "Native (Rust) runtime for Mah .mahc bytecode -- see docs/RUST_VM.md"
publish = false

# A small, vetted set of dependencies (docs/STDLIB.md "Decisions"), each
# with its reason:
[dependencies]
# std:regex's matcher (M32). No default features: Unicode tables only, no
# SIMD/aho-corasick prefilters, to keep the binary small.
regex = { version = "1.13", default-features = false, features = ["std", "unicode"] }
# std:socket's TLS clients (M39, socket.start_tls) and servers (M42,
# socket.tls_server_config/start_tls_server). The `ring` provider only: no
# C/assembly toolchain beyond what `ring` builds itself, no aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The trusted root certificates when SSL_CERT_FILE isn't set (Mozilla's set).
webpki-roots = "1"

[lib]
name = "mah_vm"
path = "src/lib.rs"

[[bin]]
name = "mah-vm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
