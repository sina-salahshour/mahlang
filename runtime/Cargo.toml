[package]
name = "mah-vm"
version = "0.1.0"
edition = "2024"
description = "Native (Rust) runtime for Mah .mahc bytecode -- see docs/RUST_VM.md"
publish = false

# Standard library only: no [dependencies], on purpose.

[lib]
name = "mah_vm"
path = "src/lib.rs"

[[bin]]
name = "mah-vm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
