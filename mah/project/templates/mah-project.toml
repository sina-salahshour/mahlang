# Mah project manifest -- read by `mah run` and `mah build`.

[package]
name = "{{name}}"
version = "0.1.0"        # your project's own version
entry = "src/main.mh"    # the file `mah run` executes (relative to this file)

# Build outputs. `mah build` writes every [[target]]; `mah build --target NAME`
# writes just one.
#   profile = "debug"    keeps source locations, so runtime errors say where
#   profile = "release"  strips them: a smaller file, errors give no location
#   self-contained = true  (optional) bundles the Rust runtime into the output,
#                          so it runs without mah installed (same OS and CPU)
[[target]]
name = "debug"
profile = "debug"
out = "build/{{name}}-debug.mahc"

[[target]]
name = "release"
profile = "release"
out = "build/{{name}}.mahc"

# A standalone executable of the release build (needs the Rust runtime, mah-vm):
# [[target]]
# name = "dist"
# profile = "release"
# out = "build/{{name}}"
# self-contained = true

# How `mah run` runs the project: vm = "python" (the reference VM) or
# vm = "rust" (the faster native runtime, mah-vm). `mah run --vm ...` overrides it.
[run]
vm = "python"

# Static type checking (see `mah check`):
#   "loose"    types are advisory: editor warnings only; run/build don't check
#   "strict"   type errors are compile errors (editor, run, build)
#   "explicit" like strict, and every declaration whose type can't be inferred
#              must be annotated
[types]
check = "loose"

# Packages from GitHub, fetched by `mah install` into .mah/ (pinned in mah-lock.toml,
# which you commit):
#   json5 = { github = "owner/repo", tag = "v1.0.0" }    # or branch = "main", or rev = "<commit>"
#   utils = { github = "owner/monorepo", branch = "main", path = "packages/utils" }
# Import them as `import json5 from "pkg:json5"`.
[dependencies]
